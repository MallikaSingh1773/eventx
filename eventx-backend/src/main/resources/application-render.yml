server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # globally_quoted_identifiers is deliberately NOT set here. It quotes the
        # column type as well as the identifier, so a columnDefinition of TEXT is
        # emitted as "TEXT", which PostgreSQL rejects as an unknown type. The
        # events and tickets tables are then silently never created.
        default_batch_fetch_size: 20
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # No Redis in this deployment. The seat lock service already falls back to
  # in-process locks, which is correct for a single instance, so the Redis
  # autoconfiguration is excluded outright rather than pointed at a server that
  # does not exist.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://*.onrender.com,http://localhost:*,http://127.0.0.1:*}
