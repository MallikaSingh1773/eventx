server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        default_batch_fetch_size: 20
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # No Redis in this deployment. Without this exclusion Spring would still build
  # a StringRedisTemplate pointing at localhost, and every seat lock would pay a
  # failed connection before falling back. Leaving the bean out entirely makes
  # SeatLockServiceImpl take its in-memory path directly.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://*.onrender.com,http://localhost:*,http://127.0.0.1:*}
