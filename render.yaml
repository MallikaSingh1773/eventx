# Render blueprint for EventX.
#
#   Render dashboard -> New -> Blueprint -> pick this repository
#
# Two services only. The database lives on Neon rather than Render, so it is not
# subject to Render's one-free-database-per-workspace limit or its 30 day expiry,
# and Redis is left out entirely: the seat lock service falls back to in-process
# locks, which is correct for a single instance deployment.

services:
  - type: web
    name: eventx-java-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./eventx-backend/Dockerfile
    dockerContext: ./eventx-backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      - key: JWT_SECRET
        generateValue: true
      # PostgreSQL connection details, taken from the Neon dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://eventx-java-web.onrender.com,http://localhost:5173
      # Razorpay test keys. Payments stay in test mode until these are replaced.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: eventx-java-web
    runtime: static
    rootDir: eventx-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eventx-java-api.onrender.com/api
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
