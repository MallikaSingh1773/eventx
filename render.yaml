# EventX on Render: API (Docker + Postgres + Redis) and static frontend.
# Connect this GitHub repo in the Render Dashboard → New → Blueprint.
# Service URLs:
#   API  https://eventx-api.onrender.com
#   Web  https://eventx-web.onrender.com

services:
  - type: web
    name: eventx-api
    runtime: docker
    plan: free
    dockerfilePath: ./eventx-backend/Dockerfile
    dockerContext: ./eventx-backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: eventx-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: eventx-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: eventx-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: eventx-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: eventx-db
          property: database
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eventx-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://eventx-web.onrender.com,https://*.onrender.com,http://localhost:*
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: eventx-web
    runtime: static
    rootDir: eventx-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eventx-api.onrender.com/api
      - key: VITE_RAZORPAY_KEY_ID
        sync: false

  - type: keyvalue
    name: eventx-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: eventx-db
    plan: free
    postgresMajorVersion: 16
